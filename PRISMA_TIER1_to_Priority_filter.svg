<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 920" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>PRISMA-style filtering of TIER_1_HIGH down to the prioritized review list</title>
  <desc>Flow diagram showing how 1,017 papers in TIER_1_HIGH were narrowed to 31 Priority A and 14 Priority B papers through provenance splitting and abstract-based relevance screening.</desc>

  <!-- White background for standalone use -->
  <rect width="1080" height="920" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-excl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="540" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">
    Filtering TIER_1_HIGH (n=1,017) to the prioritized review list (n=45)
  </text>

  <!-- Stage labels on the left -->
  <g font-size="11" font-weight="600" fill="#6b7280" text-anchor="start">
    <text x="20" y="70">IDENTIFICATION</text>
    <text x="20" y="220">PROVENANCE</text>
    <text x="20" y="430">SCREENING</text>
    <text x="20" y="700">ELIGIBILITY</text>
    <text x="20" y="860">INCLUDED</text>
  </g>
  <line x1="160" y1="50" x2="160" y2="880" stroke="#e5e7eb" stroke-dasharray="2,4"/>

  <!-- TOP: TIER_1_HIGH pool -->
  <g>
    <rect x="380" y="40" width="320" height="64" rx="6" fill="#f9fafb" stroke="#111827" stroke-width="1.5"/>
    <text x="540" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">TIER_1_HIGH in v4 workbook</text>
    <text x="540" y="86" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">n = 1,017 rows</text>
  </g>

  <line x1="540" y1="104" x2="540" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PROVENANCE SPLIT -->
  <g>
    <rect x="220" y="155" width="300" height="90" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
    <text x="370" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Pre-existing in Tier 1</text>
    <text x="370" y="200" text-anchor="middle" font-size="11" fill="#6b7280">from initial keyword screen</text>
    <text x="370" y="222" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">n ≈ 763 rows</text>
    <text x="370" y="238" text-anchor="middle" font-size="10" fill="#6b7280">not individually classified this session</text>
  </g>
  <g>
    <rect x="560" y="155" width="300" height="90" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="710" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Promoted Tier 3 → Tier 1</text>
    <text x="710" y="200" text-anchor="middle" font-size="11" fill="#6b7280">via PubMed abstract enrichment</text>
    <text x="710" y="222" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">n = 254 rows · 146 unique PMIDs</text>
    <text x="710" y="238" text-anchor="middle" font-size="10" fill="#6b7280">~1.74 rows/PMID due to RIS duplicates</text>
  </g>
  <line x1="540" y1="120" x2="370" y2="155" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="120" x2="710" y2="155" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LEFT BRANCH: deferred -->
  <line x1="370" y1="245" x2="370" y2="300" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-excl)"/>
  <g>
    <rect x="220" y="305" width="300" height="60" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="370" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="#6b7280">Deferred to full-text reviewer</text>
    <text x="370" y="350" text-anchor="middle" font-size="14" font-weight="700" fill="#6b7280">n ≈ 763</text>
  </g>

  <!-- RIGHT BRANCH: screening of 146 enriched PMIDs -->
  <line x1="710" y1="245" x2="710" y2="290" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="560" y="295" width="300" height="60" rx="6" fill="#f9fafb" stroke="#111827" stroke-width="1.2"/>
    <text x="710" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Abstract-decision notes classified</text>
    <text x="710" y="340" text-anchor="middle" font-size="11" fill="#6b7280">keyword filter + manual inspection · 146 PMIDs</text>
  </g>

  <!-- Four screening buckets -->
  <line x1="710" y1="355" x2="710" y2="395" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g font-size="11" fill="#111827">
    <rect x="555" y="400" width="150" height="74" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
    <text x="630" y="420" text-anchor="middle" font-weight="700">Clinical only</text>
    <text x="630" y="438" text-anchor="middle" fill="#6b7280" font-size="10">no system-comparison language</text>
    <text x="630" y="462" text-anchor="middle" font-size="20" font-weight="800">14</text>

    <rect x="715" y="400" width="150" height="74" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
    <text x="790" y="420" text-anchor="middle" font-weight="700">Mixed</text>
    <text x="790" y="438" text-anchor="middle" fill="#6b7280" font-size="10">clinical + system framing</text>
    <text x="790" y="462" text-anchor="middle" font-size="20" font-weight="800">11</text>

    <rect x="395" y="400" width="150" height="74" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
    <text x="470" y="420" text-anchor="middle" font-weight="700" fill="#6b7280">Lab / system only</text>
    <text x="470" y="438" text-anchor="middle" fill="#6b7280" font-size="10">BC bottle/media comparison</text>
    <text x="470" y="462" text-anchor="middle" font-size="20" font-weight="800" fill="#6b7280">88</text>

    <rect x="875" y="400" width="150" height="74" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
    <text x="950" y="420" text-anchor="middle" font-weight="700">Neither (mixed bag)</text>
    <text x="950" y="438" text-anchor="middle" fill="#6b7280" font-size="10">re-screened by hand</text>
    <text x="950" y="462" text-anchor="middle" font-size="20" font-weight="800">33</text>
  </g>

  <!-- Excluded box for Lab / system -->
  <line x1="470" y1="474" x2="470" y2="560" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-excl)"/>
  <g>
    <rect x="280" y="565" width="380" height="120" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="470" y="588" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">Excluded — off-topic for meta-analysis</text>
    <text x="470" y="610" text-anchor="middle" font-size="11" fill="#6b7280">measure TTD as a lab-bench metric, not a</text>
    <text x="470" y="624" text-anchor="middle" font-size="11" fill="#6b7280">clinical predictor of antibiotic failure</text>
    <text x="470" y="644" text-anchor="middle" font-size="10" fill="#9ca3af">BC bottle/media comparisons, antimicrobial neutralization</text>
    <text x="470" y="658" text-anchor="middle" font-size="10" fill="#9ca3af">in vitro, fungal media, system performance studies</text>
    <text x="470" y="678" text-anchor="middle" font-size="14" font-weight="800" fill="#6b7280">n = 101</text>
  </g>

  <!-- Connectors into eligibility -->
  <line x1="630" y1="474" x2="630" y2="510" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="790" y1="474" x2="790" y2="510" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="950" y1="474" x2="950" y2="510" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="630" y1="510" x2="950" y2="510" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="790" y1="510" x2="790" y2="560" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Eligibility box -->
  <g>
    <rect x="685" y="565" width="270" height="84" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="820" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Eligible for prioritized review</text>
    <text x="820" y="608" text-anchor="middle" font-size="11" fill="#6b7280">screened by category &amp; relevance to</text>
    <text x="820" y="622" text-anchor="middle" font-size="11" fill="#6b7280">"TTP as predictor of antibiotic failure"</text>
    <text x="820" y="642" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">n = 45 PMIDs</text>
  </g>

  <!-- Branch to final A and B -->
  <line x1="820" y1="649" x2="820" y2="700" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="690" y1="700" x2="950" y2="700" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="690" y1="700" x2="690" y2="740" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="950" y1="700" x2="950" y2="740" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Priority A and B boxes -->
  <g>
    <rect x="560" y="745" width="260" height="110" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="690" y="772" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">PRIORITY A</text>
    <text x="690" y="792" text-anchor="middle" font-size="11" fill="#6b7280">DTP/CRBSI dx · TTP as outcome predictor</text>
    <text x="690" y="806" text-anchor="middle" font-size="11" fill="#6b7280">TTP by species/clinical context</text>
    <text x="690" y="838" text-anchor="middle" font-size="28" font-weight="800" fill="#4f46e5">31</text>
  </g>
  <g>
    <rect x="820" y="745" width="260" height="110" rx="6" fill="#f9fafb" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="950" y="772" text-anchor="middle" font-size="14" font-weight="800" fill="#111827">PRIORITY B</text>
    <text x="950" y="792" text-anchor="middle" font-size="11" fill="#6b7280">pre-analytical / workflow ·</text>
    <text x="950" y="806" text-anchor="middle" font-size="11" fill="#6b7280">antimicrobial neutralization · molecular dx</text>
    <text x="950" y="838" text-anchor="middle" font-size="28" font-weight="800" fill="#4f46e5">14</text>
  </g>

  <!-- Footnote -->
  <text x="540" y="900" text-anchor="middle" font-size="10" fill="#9ca3af">
    Source: Triage_NewSearch_2026-05-22_tiered_v4.xlsx · enriched_abstracts_full.json (299 entries · 146 with ttp_signal=true)
  </text>
</svg>
